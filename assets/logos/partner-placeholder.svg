<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .card { fill: #ffffff; filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.05)); rx: 16px; }
      .border-dashed { fill: none; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; }
      .badge-bg { fill: #1e3a8a; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
      .main-text { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; text-anchor: middle; }
      .sub-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .handshake-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
      .handshake-icon { fill: none; stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .cta-bg { fill: #0066ff; rx: 20px; }
      .cta-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Container Background -->
  <rect x="20" y="20" width="360" height="360" class="card" rx="16" />

  <!-- Inner Dashed Interactive Border -->
  <rect x="40" y="40" width="320" height="320" class="border-dashed" rx="12" />

  <!-- Top Partnership Badge -->
  <g transform="translate(200, 62)">
    <path d="M -96 0 C -48 -12 48 -12 96 0 L 81 22 C 38 28 -38 28 -81 22 Z" class="badge-bg" />
    <text x="0" y="14" class="badge-text">PARTNERSHIP OPPORTUNITY</text>
  </g>

  <!-- Center Handshake / Partner Placeholder Graphic -->
  <g transform="translate(200, 145)">
    <rect x="-42" y="-32" width="84" height="64" class="handshake-box" rx="10" />
    <!-- Handshake Line Icon -->
    <path class="handshake-icon" d="M -22 -6 L -12 -16 L -4 -8 L 4 -16 L 12 -8 L 22 -16 M -16 -2 L -8 6 L 0 -2 L 8 6 L 16 -2 M -6 12 H 6 M -4 16 H 4" />
  </g>

  <!-- Typography Block -->
  <text x="200" y="240" class="main-text">PUT YOUR LOGO HERE</text>
  <text x="200" y="264" class="sub-text">Claim This Space</text>

  <!-- Call to Action Button -->
  <g transform="translate(95, 296)">
    <rect x="0" y="0" width="210" height="40" class="cta-bg" rx="20" />
    <text x="105" y="25" class="cta-text">BECOME A PARTNER</text>
    
    <!-- Cursor Hint -->
    <path transform="translate(178, 22) scale(0.7)" fill="#ffffff" d="M0 0l6.5 17.5-3.5-3.5-5 5L0 0z" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.3))" />
  </g>
</svg>

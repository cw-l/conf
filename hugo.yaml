        params:
            # Open Graph / X (Twitter) Cards
            description: |
                Where Singapore's cyber community thrives and everyone is welcome!
            themes:
                event:
                    slogan: BSidesSG is an open, grassroots security community welcoming everyone.
                    location: Singapore
                    description: |
                        After a hiatus, BSidesSG is back! 
                        
                        We are excited to announce the 7th edition of BSides Singapore, a community-driven conference focused on deep, technical understanding of topics related to information security.

                        We will be starting our Call for Speakers and Call for Workshops soon, so watch this space!
                    directions: |
                        #### By Public Transportation
                        To be advised.

                        #### By Car:
                        To be advised.
                    aboutUs: |
                        ### Mission
                        At BSides Singapore, we create opportunities for individuals to both present and participate in an intimate atmosphere that encourages collaboration. BSides Singapore is a community-driven conference focused on deep, technical understanding of topics related to information security. It is where conversations for the next-big-thing are happening.

                        BSides Singapore debuted in 2019 and held its 6th edition in 2024. Every edition welcomed around 150-200 participants from both the local and international security community. Feedback from participants and sponsors was overwhelmingly positive, and we have kept that trust at the centre of how we plan each edition since. We deliberately retain the focused, single-track format because it keeps the technical bar high: every participant sees every talk, and every sponsor is visible to the entire room.

                        BSides Singapore Security Conference is now organized by BSides SIN Pte. Ltd.
                    callToActionSecondary:
                      label: Become a Speaker!
                    callToActionTertiary:
                      label: Volunteer with Us!

